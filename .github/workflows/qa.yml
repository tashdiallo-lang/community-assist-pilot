name: Community Assist QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: community-assist-verified-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
